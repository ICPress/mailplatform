<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Confirmed – ICPress</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F7FA; font-family: Arial, Helvetica, sans-serif;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F7FA;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Card -->
        <table width="480" cellpadding="0" cellspacing="0" border="0"
          style="background-color:#ffffff; border-radius:12px; overflow:hidden;
                 box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width:480px;">

          <!-- Header bar -->
          <tr>
            <td align="center" style="background-color:#0A2463; padding: 32px 36px 24px;">
              <img src="{{static_path}}icon.svg" alt="ICPress" width="110" height="100"
                style="display:block; margin: 0 auto 18px;">

            </td>
          </tr>

          <!-- Accent stripe -->
          <tr>
            <td style="height:4px; background-color:#3E92CC;"></td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 36px 40px 28px; color:#1E1E24; font-size:15px; line-height:1.75; text-align:left;">

              <p style="margin:0 0 20px; font-size:16px; font-weight:700; color:#0A2463;">
                Transfer Confirmed
              </p>

              <p style="margin:0 0 20px; color:#5A6570; font-size:14px; line-height:1.8;">
                The following transfer to wallet
                <a href="https://solscan.io/account/{{wallet}}" target="_blank"
                  style="color:#3E92CC; font-weight:600; text-decoration:none;">{{displayWallet}}</a>
                has been processed and confirmed on-chain. Please retain this record for your files.
              </p>

              <!-- Items section header -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:14px;">
                <tr>
                  <td style="padding-bottom:10px; border-bottom:2px solid #3E92CC;">
                    <p style="margin:0; font-size:11px; font-weight:700; color:#0A2463;
                               text-transform:uppercase; letter-spacing:1.2px;">
                      Items Transferred
                    </p>
                  </td>
                </tr>
              </table>

              <!-- Dynamic items slot -->
              {{itemsTransfered}}

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 16px 40px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                style="border-top:1px solid #E1E5EB;">
                <tr>
                  <td align="center" style="padding-top:18px; font-size:12px; color:#8C95A0; line-height:1.6;">
                    The ICPress Editorial Team<br>
                    
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
